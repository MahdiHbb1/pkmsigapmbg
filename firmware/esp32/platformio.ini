; PlatformIO Project Configuration File for SIGAP MBG
; ESP32 with TensorFlow Lite Micro

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps = 
    adafruit/Adafruit SHT31 Library@^2.2.0
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/eloquentarduino/EloquentTinyML.git

build_flags = 
    -DESP32
    -DARDUINO_ARCH_ESP32
